name: Release Foundry Module

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Type checks
        run: npm run typecheck

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release version
        id: version
        run: |
          VERSION="$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        run: |
          mkdir -p dist package

          jq --arg version "${{ steps.version.outputs.version }}" \
            '.version = $version | .download = "https://github.com/BlackRaven007/DDB-Proxy/releases/latest/download/module.zip"' \
            module.json > dist/module.json

          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'package' \
            ./ package/

          cp dist/module.json package/module.json
          (cd package && zip -r ../dist/module.zip .)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/module.json
            dist/module.zip